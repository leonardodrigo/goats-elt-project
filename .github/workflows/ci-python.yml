name: Python CI (uv)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Use same version as local development
          python-version-file: ".python-version"

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies (uv sync)
        run: uv sync --all-extras
      
      - name: Check uv.lock
        run: uv lock --check

      - name: Run tests
        run: |
          if [ -d tests ]; then
            uv run pytest -q
          else
            echo "No tests/ directory, skipping tests"
          fi
