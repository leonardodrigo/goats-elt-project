name: goats-elt-project
services:
  postgres:
    image: postgres:17.0
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goats_elt
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data     # Named volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "goats_elt"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 80s

  minio:
    image:  minio/minio
    container_name: goatminio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKETS=${MINIO_DEFAULT_BUCKETS}
    command: server /data --console-address ":9001"

  elt-service:
    build:
      context: ../
      dockerfile: infra/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/goats_elt
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_DEFAULT_BUCKETS}

volumes:
  pg_data:
  minio_data: