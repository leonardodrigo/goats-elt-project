name: goats-elt-project
services:
  postgres:
    image: postgres:17.0
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goats_elt
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data     # Named volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "goats_elt"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 80s

volumes:
  pg_data: