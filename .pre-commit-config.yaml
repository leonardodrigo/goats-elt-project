repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        args: [--fix, "--ignore=F841,E402"]
        files: ^src/|^tests/
      - id: ruff-format
        files: ^src/|^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^notebooks/
      - id: trailing-whitespace
        exclude: ^notebooks/
