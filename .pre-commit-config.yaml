repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        args: [--fix, "--ignore=F841,E402"]
        files: ^src/|^tests/
      - id: ruff-format
        files: ^src/|^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^notebooks/
      - id: trailing-whitespace
        exclude: ^notebooks/


  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        additional_dependencies:
          ["dbt-postgres==1.9.1", "sqlfluff-templater-dbt==3.4.2"]
        files: goats_dbt/models/
      - id: sqlfluff-fix
        additional_dependencies:
          ["dbt-postgres==1.9.1", "sqlfluff-templater-dbt==3.4.2"]
        files: goats_dbt/models/

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.7
    hooks:
      - id: dbt-parse
        args:
          [
            "--cmd-flags",
            "++profiles-dir",
            "goats_dbt",
            "++project-dir",
            "goats_dbt",
            "++target",
            "dev"
          ]
        additional_dependencies:
          - dbt-core==1.9.1
          - dbt-postgres==1.9.1
