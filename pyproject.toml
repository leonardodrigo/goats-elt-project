[project]
name = "goats-elt-project"
version = "0.1.0"
description = "ELT Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.12.0",
    "fastapi>=0.117.1",
    "minio>=7.2.18",
    "pydantic>=2.12.4",
    "spotipy>=2.25.1",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
    "python-dotenv>=1.2.1",
    "dbt-postgres>=1.9.1",
    "dbt-core>=1.10.15",
]

[project.scripts]
goats-elt = "src.main:app"
get-token = "src.token:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=3.1.3",
    "apache-airflow-providers-standard>=1.9.1",
    "apache-airflow-providers-http>=5.4.0",
]

dev = [
    "ruff>=0.14.4",
    "pre-commit>=4.4.0",
]
