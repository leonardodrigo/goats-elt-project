[project]
name = "goats-elt-project"
version = "0.1.0"
description = "ELT Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "psycopg2-binary~=2.9.9",
]

[project.scripts]
goats-elt = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
]
