[project]
name = "goats-elt-project"
version = "0.1.0"
description = "ELT Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minio>=7.2.18",
    "pre-commit>=4.4.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "spotipy>=2.25.1",
    "typer>=0.20.0",
    "psycopg2-binary~=2.9.9",
    "dbt-core>=1.1",
    "dbt-postgres>=1.9.0",
    "boto3"
]

[project.scripts]
goats-elt = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
]
