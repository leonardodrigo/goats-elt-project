[project]
name = "goats-elt-project"
version = "0.1.0"
description = "ELT Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minio>=7.2.18",
    "pre-commit>=4.4.0",
    "python-dotenv>=1.2.1",
    "spotipy>=2.25.1",
    "typer>=0.20.0",
]

[project.scripts]
goats-elt = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=3.1.3",
    "apache-airflow-providers-standard>=1.9.1",
]

dev = [
    "ruff>=0.14.4",
]
